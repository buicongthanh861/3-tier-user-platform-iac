name: IaC Scan

on:
  push:
    branches: [master]
    paths:
      - terraform/**
      - k8s/**
      - argocd/**
      - .github/workflows/iac-scan.yaml
  pull_request:
    branches: [master]
    paths:
      - terraform/**
      - k8s/**
      - argocd/**
      - .github/workflows/iac-scan.yaml

permissions:
  contents: read

jobs:
  security-scan:
    name: Checkov security scan
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Checkov
        run: pip install checkov

      - name: Scan Terraform IaC
        run: checkov -d terraform --framework terraform --quiet
        continue-on-error: true

      - name: Scan Kubernetes manifests
        run: checkov -d k8s --framework kubernetes --quiet
        continue-on-error: true

      - name: Scan ArgoCD manifests
        run: checkov -d argocd --framework kubernetes --quiet
        continue-on-error: true

