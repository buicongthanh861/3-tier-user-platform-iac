apiVersion: v1
kind: Service
metadata:
  name: database-service
  labels:
    app.kubernetes.io/name: database
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  clusterIP: None
  selector:
    app: database
  ports:
    - name: mysql
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.port }}

