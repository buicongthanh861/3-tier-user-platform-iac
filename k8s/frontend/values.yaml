replicaCount: 1

image:
  repository: 159749281332.dkr.ecr.ap-southeast-1.amazonaws.com/3-tier-user-platform-frontend
  tag: 4bc25734e2719e3db0711e77ead56ffa86539ec7
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80

resources:
  limits:
    cpu: 500m
    memory: 128Mi
  requests:
    cpu: 250m
    memory: 128Mi

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 50

ingress:
  enabled: true
  className: nginx          
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
